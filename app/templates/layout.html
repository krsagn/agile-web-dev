<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quokka{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/userProfile.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="app-container">

        <div class="sidebar">
            <div>
                <div class="logo-section">
                    <div class="logo-box"></div>
                    <div class="logo-text">Quokka</div>
                </div>

                <ul class="nav-links">
                    <li{% if active_page == 'profile' %} class="active"{% endif %}>
                        <a href="{{ url_for('main.profile') }}">
                            <i class="bi bi-person"></i>Profile
                        </a>
                    </li>
                    <li{% if active_page == 'leaderboard' %} class="active"{% endif %}>
                        <a href="{{ url_for('main.leaderboard') }}">
                            <i class="bi bi-trophy"></i>Leaderboard
                        </a>
                    </li>
                    <li{% if active_page == 'history' %} class="active"{% endif %}>
                        <a href="#">
                            <i class="bi bi-clock-history"></i>History
                        </a>
                    </li>
                    <li{% if active_page == 'quiz' %} class="active"{% endif %}>
                        <a href="{{ url_for('main.quiz') }}">
                            <i class="bi bi-patch-question"></i>Quiz
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sidebar-profile">
                <img src="https://via.placeholder.com/45" alt="Profile">
                <div class="profile-name-small">Samuel C.</div>
            </div>
        </div>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
