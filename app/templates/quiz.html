<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Daily Quiz</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">
          <i class="bi bi-lightning-charge-fill text-warning me-1"></i>Daily
          Quiz
        </a>
      </div>
    </nav>

    <main class="container py-4">
      <!-- Quiz Content -->
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Progress Card -->
          <div class="card mb-4">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small">Question</span>
                <span class="badge bg-warning text-dark" id="question-counter">1/10</span>
              </div>
              <div class="progress mb-2" style="height: 8px;">
                <div class="progress-bar bg-warning" id="quiz-progress" style="width: 10%;"></div>
              </div>
              <div class="d-flex justify-content-between small text-muted">
                <span id="time-elapsed">Time: 0:00</span>
                <span id="score-preview">Score: 0</span>
              </div>
            </div>
          </div>

          <!-- Question Display -->
          <div class="card mb-4">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge bg-light text-dark" id="q-category">General Knowledge</span>
              </div>
              <h5 class="card-title fw-bold" id="q-text">What is the primary purpose of the Agile Manifesto?</h5>
            </div>
          </div>

          <!-- Options -->
          <div class="d-flex flex-column gap-3 mb-4">
            <button class="option-card btn btn-light text-start p-3" data-option="A">
              <span class="badge bg-secondary me-2">A</span>
              <span class="option-text">To define strict rules and procedures for software development</span>
            </button>
            <button class="option-card btn btn-light text-start p-3" data-option="B">
              <span class="badge bg-secondary me-2">B</span>
              <span class="option-text">To prioritize individuals and interactions over processes and tools</span>
            </button>
            <button class="option-card btn btn-light text-start p-3" data-option="C">
              <span class="badge bg-secondary me-2">C</span>
              <span class="option-text">To replace all documentation with working software</span>
            </button>
            <button class="option-card btn btn-light text-start p-3" data-option="D">
              <span class="badge bg-secondary me-2">D</span>
              <span class="option-text">To eliminate the need for any planning in projects</span>
            </button>
          </div>

          <!-- Navigation Buttons -->
          <div class="d-flex justify-content-between">
            <button class="btn btn-outline-secondary" id="prev-btn" disabled>
              <i class="bi bi-arrow-left me-1"></i> Previous
            </button>
            <button class="btn btn-warning text-dark" id="next-btn">
              Next <i class="bi bi-arrow-right ms-1"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top text-secondary text-center py-3 mt-auto">
      <small>&copy; 2026 Daily Quiz &mdash; UWA CITS3403</small>
    </footer>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmcuFbdNpw4LI8mq6vBwFXJM4R1"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <script>
      // Simple quiz logic for demonstration
      const quizData = [
        {
          question: "What is the primary purpose of the Agile Manifesto?",
          category: "Agile",
          options: {
            A: "To define strict rules and procedures for software development",
            B: "To prioritize individuals and interactions over processes and tools",
            C: "To replace all documentation with working software",
            D: "To eliminate the need for any planning in projects"
          },
          correct: "B"
        },
        // Add more questions here
      ];

      let currentQuestion = 0;
      let userAnswers = {};

      function loadQuestion(index) {
        const q = quizData[index];
        document.getElementById('q-text').textContent = q.question;
        document.getElementById('q-category').textContent = q.category;
        
        const options = document.querySelectorAll('.option-card');
        options.forEach(opt => {
          const letter = opt.dataset.option;
          opt.querySelector('.option-text').textContent = q.options[letter];
          opt.classList.remove('selected', 'correct', 'incorrect');
          opt.classList.add('btn-light');
          opt.classList.remove('btn-warning', 'btn-success', 'btn-danger');
          
          if (userAnswers[index] === letter) {
            opt.classList.add('selected');
            opt.classList.remove('btn-light');
            opt.classList.add('btn-warning');
          }
        });

        // Update progress
        document.getElementById('question-counter').textContent = `${index + 1}/${quizData.length}`;
        document.getElementById('quiz-progress').style.width = `${((index + 1) / quizData.length) * 100}%`;

        // Update buttons
        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').innerHTML = index === quizData.length - 1 
          ? 'Finish Quiz <i class="bi bi-arrow-right ms-1"></i>' 
          : 'Next <i class="bi bi-arrow-right ms-1"></i>';
      }

      // Option click handler
      document.querySelectorAll('.option-card').forEach(option => {
        option.addEventListener('click', function() {
          const letter = this.dataset.option;
          userAnswers[currentQuestion] = letter;
          
          document.querySelectorAll('.option-card').forEach(opt => {
            opt.classList.remove('selected', 'btn-warning');
            opt.classList.add('btn-light');
          });
          this.classList.add('selected');
          this.classList.remove('btn-light');
          this.classList.add('btn-warning');
          
          // Update score preview
          const score = Object.keys(userAnswers).length;
          document.getElementById('score-preview').textContent = `Score: ${score}`;
        });
      });

      // Navigation handlers
      document.getElementById('prev-btn').addEventListener('click', () => {
        if (currentQuestion > 0) {
          currentQuestion--;
          loadQuestion(currentQuestion);
        }
      });

      document.getElementById('next-btn').addEventListener('click', () => {
        if (currentQuestion < quizData.length - 1) {
          currentQuestion++;
          loadQuestion(currentQuestion);
        } else {
          // Finish quiz - redirect to results
          window.location.href = "{{ url_for('main.results') }}";
        }
      });

      // Initialize timer
      let seconds = 0;
      setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById('time-elapsed').textContent = `Time: ${mins}:${secs.toString().padStart(2, '0')}`;
      }, 1000);

      // Load first question
      loadQuestion(0);
    </script>
  </body>
</html>
